<!DOCTYPE html>
<html lang="en" class="no-js">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>HYAICO — Built for what's next</title>
  <meta name="description" content="HYAICO. Built for what's next. Makers of Just Cooked.">
  <meta name="theme-color" content="#06060a">
  <meta name="color-scheme" content="dark">

  <meta property="og:type" content="website">
  <meta property="og:title" content="HYAICO — Built for what's next">
  <meta property="og:description" content="Makers of Just Cooked.">
  <meta property="og:image" content="assets/og.png">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>
  <script>document.documentElement.classList.replace('no-js', 'js');</script>
</head>
<body class="is-loading">

  <div class="bg-glow" aria-hidden="true"></div>
  <div class="grain" aria-hidden="true"></div>
  <div class="progress" aria-hidden="true"><span></span></div>

  <div class="cursor" aria-hidden="true">
    <div class="cursor__dot"></div>
    <div class="cursor__ring"><i class="cursor__cross"></i></div>
  </div>

  <!-- ============ LOADER ============ -->
  <div class="loader" id="loader" aria-hidden="true">
    <div class="loader__logo">
      <img src="assets/HyaicoWhite.svg" alt="" class="loader__mark" id="loaderMark" width="619" height="101">
      <i class="loader__beam"></i>
    </div>
    <div class="loader__meta">
      <span class="loader__line"><span></span></span>
      <span class="loader__count"><b data-loader-count>0</b>%</span>
    </div>
  </div>

  <!-- ============ 3D STAGE (fixed, behind everything) ============ -->
  <canvas id="gl" class="gl" aria-hidden="true"></canvas>
  <div class="gl-fallback" aria-hidden="true"></div>

  <!-- ============ NAV ============ -->
  <header class="nav" id="nav">
    <div class="nav__inner">
      <a href="#top" class="nav__logo" aria-label="HYAICO — back to top" data-cursor="link">
        <img src="assets/HyaicoWhite.svg" alt="HYAICO" width="124" height="20">
      </a>
      <a href="https://justcooked.app" target="_blank" rel="noopener" class="btn btn--sm btn--light" data-magnetic data-cursor="link">
        <img src="assets/Icon.svg" alt="" class="btn__icon" width="18" height="18">
        <span>Just Cooked</span>
        <svg class="btn__arrow" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 12 12 4M6 4h6v6"/></svg>
      </a>
    </div>
  </header>

  <main id="top">
    <!-- ============ STORY (pinned, scroll-driven) ============ -->
    <section class="story" id="story">
      <div class="story__pin">

        <div class="story__text story__text--hero" id="heroText">
          <p class="eyebrow"><span class="eyebrow__dot"></span><span data-scramble>HYAICO</span></p>
          <h1 class="title">Built for <em>what's next.</em></h1>
        </div>

        <div class="story__text story__text--mid" id="midText">
          <h2 class="title title--md">Things that <em>should exist.</em></h2>
        </div>

        <div class="story__text story__text--jc" id="jcText">
          <p class="eyebrow"><span class="live-dot"></span><span data-scramble>Introducing</span></p>
          <h2 class="title title--md jc__title"><img src="assets/Icon.svg" alt="" class="jc__icon" width="56" height="56">Just Cooked</h2>
          <p class="lead">Home cooking, <em>made easy.</em></p>
          <a href="https://justcooked.app" target="_blank" rel="noopener" class="btn btn--jc" data-magnetic data-cursor="link">
            <span>Open justcooked.app</span>
            <svg class="btn__arrow" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 12 12 4M6 4h6v6"/></svg>
          </a>
        </div>

        <div class="scroll-cue" id="scrollCue" aria-hidden="true">
          <span class="scroll-cue__line"></span>
          <span class="scroll-cue__text">Scroll</span>
        </div>

        <div class="rail" id="rail" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
        <div class="scene-label" aria-hidden="true"><span id="sceneLabel">01 // ORIGIN</span></div>
      </div>
    </section>

    <!-- ============ OUTRO ============ -->
    <section class="outro" id="outro">
      <div class="outro__inner">
        <p class="outro__line" data-reveal>Built for <em>what's next.</em></p>
        <div class="outro__wordmark" id="footerWordmark" aria-hidden="true"><i></i></div>
        <div class="outro__bar">
          <span>© <span id="year">2026</span> HYAICO</span>
          <a href="https://justcooked.app" target="_blank" rel="noopener" data-cursor="link">Just Cooked ↗</a>
          <a href="#top" data-cursor="link">Back to top ↑</a>
        </div>
      </div>
    </section>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/ScrollTrigger.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/SplitText.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/ScrambleTextPlugin.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/lenis@1.3.1/dist/lenis.min.js"></script>
  <script type="module" src="js/scene.js"></script>
  <script src="js/main.js" defer></script>
</body>
</html>
