<!DOCTYPE html>
<!-- Source for assets/og.png (1200x630). Render with a headless browser at that size. It mirrors the site's last frame. -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>HYAICO — social card</title>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@500&family=Instrument+Serif:ital@1&display=swap" rel="stylesheet">
  <style>
    html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
    body {
      position: relative; color: #f4f4f7; font-family: "Geist", system-ui, sans-serif; -webkit-font-smoothing: antialiased;
      background:
        radial-gradient(70% 60% at 50% 36%, rgba(124, 92, 255, 0.2), rgba(69, 227, 255, 0.05) 45%, transparent 75%),
        radial-gradient(100% 55% at 50% 108%, rgba(34, 44, 100, 0.4), transparent 70%),
        linear-gradient(180deg, #05060f 0%, #070816 100%);
    }
    .logo { position: absolute; left: 56px; top: 48px; height: 20px; }
    .line {
      position: absolute; left: 0; right: 0; top: 150px; margin: 0 auto; width: max-content; padding-bottom: 18px;
      font-size: 104px; line-height: 0.96; letter-spacing: -0.045em; font-weight: 500;
    }
    .line em {
      font-family: "Instrument Serif", serif; font-style: italic; font-weight: 400; padding-right: 0.08em;
      background: linear-gradient(92deg, #fff 0%, #d2c8ff 45%, #8feaff 100%); -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .line::after {
      content: ""; position: absolute; left: 8%; right: 8%; bottom: 0; height: 3px; border-radius: 3px;
      background: linear-gradient(90deg, transparent, #7c5cff 20%, #45e3ff 80%, transparent); box-shadow: 0 0 18px rgba(69, 227, 255, 0.5);
    }
    .wordmark {
      position: absolute; left: 50px; right: 50px; bottom: 26px; aspect-ratio: 619 / 101;
      background: rgba(255, 255, 255, 0.2);
      -webkit-mask-image: url("HyaicoWhite.svg"), linear-gradient(#000 30%, transparent 100%);
      -webkit-mask-size: 100% auto, 100% 100%; -webkit-mask-repeat: no-repeat; -webkit-mask-position: center; -webkit-mask-composite: source-in;
      mask-image: url("HyaicoWhite.svg"), linear-gradient(#000 30%, transparent 100%);
      mask-size: 100% auto, 100% 100%; mask-repeat: no-repeat; mask-position: center; mask-composite: intersect;
    }
  </style>
</head>
<body>
  <img class="logo" src="HyaicoWhite.svg" alt="HYAICO">
  <h1 class="line">Building <em>what's next.</em></h1>
  <div class="wordmark"></div>
</body>
</html>
